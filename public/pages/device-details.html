<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../css/style.css" />
    <script defer src="../js/device-details.js"></script>
    <title>Device Details</title>
  </head>
  <header>
    <a href="http://localhost:5000">Home</a>
  </header>
  <body>
    <h1 id="hostnameHeader"></h1>
    <label for="">Actual User: </label
    ><a href="http://localhost:5000/users/:id" id="user"></a><br />
    <label id="deviceModel">Model: </label><br />
    <label id="asset_tag">Asset Tag: </label><br />
    <label id="service_tag">Service Tag: </label><br />
    <label id="express_code">Express code: </label><br />

    <label id="comments">Comments: </label><br />
    <!-- <label>Last User</label><br /> -->
    <h3>Warranty</h3>
    <label id="warranty_date">Date: </label><br />
    <label id="warranty_status">Status: </label><br />
    <!-- <label id="days_left">Days Left: </label><br /> -->
    <div id="editDevice">
      <br /><br />
      <button id="commentBtn">Comment</button>
      <button id="btn-change-user">Change User</button>
    </div>
    <div id="comment-div" hidden>
      <br />
      <textarea
        name="comment"
        id="device-comment"
        rows="5"
        cols="50"
      ></textarea>
    </div>
    <div id="change-user-div" hidden>
      <br />
      <label id="newUser">Assig to: </label>
      <input type="text" name="new-user" id="txt-new-user" />
      <button id="btn-check">Check name</button>
    </div>
    <div id="save-div">
      <button id="btn-save" hidden>Save Changes</button>
    </div>
  </body>
</html>
