<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Devices</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <header>
    <a href="index.html">Back</a>
  </header>
  <body>
    <h1>Devices</h1>
    <label for="dId" id="lblId">Device ID: </label><br /><br /><br />
    <!-- <button id="btnAddDevice">Add Computer</button> -->
    <!-- <div id="addComputerForm"></div> -->

    <button id="btnChangeDevice">Change</button><br /><br /><br />
    <div id="changeDeviceDiv">
      <form action="" id="changeForm" hidden>
        <label for="dHostname" id="hostname">Hostname: </label><br />
        <label for="dActualUser" id="actualUser">Actual User: </label><br />
        <label for="dAsset" id="asset">Asset Tag: </label><br />
        <label for="model" id="model">Model: </label><br />
        <label for="dServiceTag" id="serviceTag">Service Tag: </label><br />
        <label for="dExpressCode" id="express">Express Code: </label><br />
        <label for="dNewUser">New User: </label>
        <input type="text" id="newUserInput" />
        <button id="saveChange">Save</button><br /><br /><br />
      </form>
    </div>

    <div id="deviceComments">
      <textarea name="Comment" id="txtComments"></textarea><br />
      <button id="btnCommentDevice">Comment</button><br /><br /><br />
    </div>
    <div id="div_device"><button id="btnDevice">Refresh</button><br /></div>
    <script src="deviceController.js"></script>
  </body>
</html>
